# shapediff: GitHub Actions workflow for the per-PR structural change comment
# (spec section 14.1, on GitHub). Copy to .github/workflows/shapediff.yml in
# the repo to be analysed.
#
# What it needs:
#   - permissions: pull-requests: write, so GITHUB_TOKEN can post the one
#     comment and edit it on the next push. The comment is found again only
#     when github-actions[bot] wrote it; a comment anyone else starts with
#     the marker is ignored.
#   - Pull requests from forks, and Dependabot's, get a read-only
#     GITHUB_TOKEN, so `post` cannot comment and the job does nothing visible
#     (it still does not fail the PR). `post` does not run under
#     pull_request_target, which would get a write token: that event runs
#     with the base repository's token, and this job checks out and reads the
#     pull request's code.
#   - fetch-depth: 0, so the base commit is present for the base graph, for
#     the merge base shapediff diffs against, and for `git diff -M`.
#   - For a repo that is not Go, the extractor to run instead of the built-in
#     Go one, as SHAPEDIFF_EXTRACTOR. The Python extractor ships in the
#     shapediff repo and needs Python 3.10 or later: 3.9 lacks
#     sys.stdlib_module_names and counts the standard library as third-party
#     packages. Uncomment the two Python lines below.

name: shapediff

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: shapediff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  shapediff:
    runs-on: ubuntu-latest
    # The job must never block a pull request (spec 14.1 failure mode).
    # `post` already exits 0 on every runtime failure; this covers the rest.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out shapediff
        uses: actions/checkout@v4
        with:
          repository: Ullauri/shapediff
          # A tag, not a branch. The graph cache key holds shapediff's
          # version number, not its commit, so building a moving branch can
          # pair a base graph from one build with a head graph from another.
          ref: v0.3.0
          path: .shapediff-src
          persist-credentials: false

      # Out of the workspace before anything is extracted, so the tool's own
      # source is not read as part of this repo.
      - name: Move shapediff out of the workspace
        run: mv .shapediff-src "$RUNNER_TEMP/shapediff-src"

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/shapediff-src/go.mod

      - name: Build shapediff
        run: go build -C "$RUNNER_TEMP/shapediff-src" -o "$RUNNER_TEMP/bin/shapediff" ./cmd/shapediff

      # - uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.12"

      # Caches from pull_request runs are scoped to their PR, so this saves
      # re-extracting on the next push to the same PR, not across PRs.
      - uses: actions/cache@v4
        with:
          path: .shapediff-cache
          key: shapediff-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            shapediff-${{ github.event.pull_request.number }}-

      - name: Post the structural change comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SHAPEDIFF_EXTRACTOR: python3 ${{ runner.temp }}/shapediff-src/extractors/python/shapediff-py
        run: |
          "$RUNNER_TEMP/bin/shapediff" version
          "$RUNNER_TEMP/bin/shapediff" post

      # Always published, structural or not, so a reader (or an agent
      # reviewer) can tell "nothing structural" from "the job did not run":
      # delta.json carries an outcome field, and note.md is the note the
      # job posted, or would have posted when the token cannot comment.
      # Neither file means post never ran, which is worth a warning.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shapediff-delta
          path: |
            shapediff/delta.json
            shapediff/note.md
          retention-days: 90
          if-no-files-found: warn
