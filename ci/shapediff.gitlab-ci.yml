# shapediff: shared CI template for the per-MR structural change note
# (spec section 14.1). Include from a repo's .gitlab-ci.yml:
#
#   include:
#     - project: 'platform/shapediff'
#       file: '/ci/shapediff.gitlab-ci.yml'
#
# Prerequisites:
#   - Merge request pipelines enabled on the project; the job runs only on
#     merge_request_event, the one pipeline source with CI_MERGE_REQUEST_DIFF_BASE_SHA.
#   - SHAPEDIFF_TOKEN: a project access token with the Reporter role, stored
#     as a masked CI variable. The Notes API needs the `api` scope, so the
#     token is bounded by role, not scope: Reporter can post notes and cannot
#     push or edit CI configuration.
#   - SHAPEDIFF_CACHE (optional): "gitlab" to use the generic package
#     registry of this project (needs the same token), or "dir:<path>" for a
#     runner-local directory. Default: .shapediff-cache under the checkout,
#     which persists only through the `cache:` block below.
#   - SHAPEDIFF_IMAGE (optional): image carrying the static `shapediff` binary
#     and the Go toolchain the repo builds with. The Go extractor runs `go list`
#     and type-checks the module, so the toolchain must match what the repo
#     needs (a `toolchain` line in go.mod makes `go` fetch it).

variables:
  SHAPEDIFF_IMAGE: "registry.example.com/platform/shapediff:latest"

shapediff:
  stage: test
  image: $SHAPEDIFF_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    # The default shallow clone usually lacks the base SHA, which breaks both
    # extraction of the base graph and `git diff -M`.
    GIT_DEPTH: 0
    GOFLAGS: "-mod=mod"
  cache:
    key: shapediff-graphs
    paths:
      - .shapediff-cache/
      - .cache/go-build/
  script:
    - shapediff version
    - shapediff post
  artifacts:
    # Always published, structural or not, so a reader (or an agent reviewer)
    # can tell "nothing structural" from "the job did not run".
    when: always
    expire_in: 90 days
    paths:
      - shapediff/delta.json
  # The job must never block a pipeline (spec 14.1 failure mode). `post`
  # already exits 0 on every runtime failure; this covers the image itself.
  allow_failure: true
  interruptible: true
